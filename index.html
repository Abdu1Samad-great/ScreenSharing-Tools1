<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScreenShare Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">
            Screen<span>Share</span>
        </div>

        <div class="badge">
            Minecraft SS Tools
        </div>
    </nav>


    <section class="hero">

        <h1>
            ScreenShare <span>Tools</span>
        </h1>

        <p>
            Find all Minecraft screenshare tools in one place.
        </p>

        <input
            type="text"
            id="search"
            placeholder="Search tools..."
        >

    </section>


<div class="tabs">

    <button class="tab active" data-category="all">
        All
    </button>

    <button class="tab" data-category="meowtools">
        MeowTools
    </button>

    <button class="tab" data-category="msc">
        MSC Tools
    </button>

    <button class="tab" data-category="modanalyzer">
        Mod Analyzer
    </button>

</div>

<main id="tools"></main>

    <script src="script.js"></script>

</body>
</html>
